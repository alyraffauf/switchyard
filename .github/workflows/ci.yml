on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]
name: CI
jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: extractions/setup-just@v2
      - name: Run tests
        run: just test
      - name: Generate coverage report
        run: just test-coverage
      - name: Display coverage summary
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  build-webextension:
    name: "Build WebExtension"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Build extension
        working-directory: webextension
        run: npm ci && npm run build

  build-flatpak:
    name: "Build Flatpak (${{ matrix.variant.arch }})"
    runs-on: ${{ matrix.variant.runner }}
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.alyraffauf.Switchyard.Devel-${{ github.sha }}-${{ matrix.variant.arch }}.flatpak
          manifest-path: flatpak/io.github.alyraffauf.Switchyard.Devel.yml
          cache-key: flatpak-builder
          arch: ${{ matrix.variant.arch }}

  publish-amo:
    name: "Publish to AMO"
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-webextension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Build extension
        working-directory: webextension
        run: npm ci && npm run build
      - name: Submit to AMO
        working-directory: webextension
        run: npx web-ext sign --channel=listed --approval-timeout=0 --api-key=${{ secrets.AMO_JWT_ISSUER }} --api-secret=${{ secrets.AMO_JWT_SECRET }}

  publish-cws:
    name: "Publish to Chrome Web Store"
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-webextension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Build extension
        working-directory: webextension
        run: npm ci && npm run build
      - name: Package extension
        working-directory: webextension
        run: zip -r ../switchyard-webextension.zip manifest.json popup.html build icons
      - name: Submit to Chrome Web Store
        run: npx chrome-webstore-upload-cli@3 upload --source switchyard-webextension.zip --auto-publish
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}

  publish-github:
    name: "Publish GitHub Release"
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-flatpak, test, publish-amo, publish-cws]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Flatpak bundles
        uses: actions/download-artifact@v4
        with:
          pattern: io.github.alyraffauf.Switchyard.Devel-${{ github.sha }}-*.flatpak
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.flatpak
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
